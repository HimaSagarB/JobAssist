# JobAssist production container, built from this repository.
# Configure .env as described in .env.example, then run:
# docker compose -f compose.production.yml up --build -d
# This container path is inherited; local verification used LOCAL-SETUP.md.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jobassist
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobassist -d jobassist"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${JOBASSIST_IMAGE:-jobassist:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobassist:${POSTGRES_PASSWORD}@db:5432/jobassist
      JOBASSIST_PASSWORD: ${JOBASSIST_PASSWORD:?Set JOBASSIST_PASSWORD in .env to a hash from hash-password}
      JOBASSIST_SECRET: ${JOBASSIST_SECRET:?Set JOBASSIST_SECRET in .env}
      JOBASSIST_BACKUP_RETENTION_DAYS: ${JOBASSIST_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      JOBASSIST_AI_PROVIDER: ${JOBASSIST_AI_PROVIDER:-}
      JOBASSIST_AI_URL: ${JOBASSIST_AI_URL:-}
      JOBASSIST_AI_MODEL: ${JOBASSIST_AI_MODEL:-}
      JOBASSIST_AI_KEY: ${JOBASSIST_AI_KEY:-}
      JOBASSIST_AI_TIMEOUT_SECONDS: ${JOBASSIST_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, JobAssist asks after sign-in; on or off answers in advance (see Privacy in the wiki).
      JOBASSIST_TELEMETRY: ${JOBASSIST_TELEMETRY:-}
      # Defaults for Settings → Job search.
      JOBASSIST_JOBS_SOURCE: ${JOBASSIST_JOBS_SOURCE:-}
      JOBASSIST_JSEARCH_KEY: ${JOBASSIST_JSEARCH_KEY:-}
      JOBASSIST_JSEARCH_HOST: ${JOBASSIST_JSEARCH_HOST:-}
      JOBASSIST_ADZUNA_APP_ID: ${JOBASSIST_ADZUNA_APP_ID:-}
      JOBASSIST_ADZUNA_KEY: ${JOBASSIST_ADZUNA_KEY:-}
      JOBASSIST_FREEHIRE_URL: ${JOBASSIST_FREEHIRE_URL:-}
      JOBASSIST_JOBS_ARBEITSAGENTUR: ${JOBASSIST_JOBS_ARBEITSAGENTUR:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      JOBASSIST_GOOGLE_CLIENT_ID: ${JOBASSIST_GOOGLE_CLIENT_ID:-}
      JOBASSIST_GOOGLE_CLIENT_SECRET: ${JOBASSIST_GOOGLE_CLIENT_SECRET:-}
      # The address JobAssist is reached at, for Google's redirect.
      JOBASSIST_PUBLIC_URL: ${JOBASSIST_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${JOBASSIST_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). JobAssist reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
